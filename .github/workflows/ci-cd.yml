name: CI/CD

# Runs on every push/PR (CI), and deploys only on pushes to main (CD) —
# so a broken branch/PR never triggers a deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourname/CustomerChurnAnalysis -> lowercased below

jobs:
  # ---------------------------------------------------------------------
  # CI: lint + sanity-check the Python code + make sure the Docker image
  # actually builds. Runs on every push and every PR.
  # ---------------------------------------------------------------------
  ci:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (for linting only, not full playwright/chromium)
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        # --exit-zero on the first pass keeps this from hard-failing your
        # very first CI run on pre-existing style issues. Remove
        # --exit-zero once the codebase is clean, so lint errors actually
        # block merges.
        run: ruff check . --exit-zero

      - name: Python syntax check
        run: python -m py_compile server.py rag_engine.py

      # This does NOT push anywhere — it just proves the Dockerfile builds
      # cleanly (deps resolve, playwright/chromium installs, etc.) before
      # we ever try to deploy it.
      - name: Build Docker image (build-only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: reading-room:ci-check

  # ---------------------------------------------------------------------
  # CD: only runs on a push to main, and only if the ci job above passed.
  # Builds the image again (this time pushing it) and tells Render to
  # deploy the latest image/commit.
  # ---------------------------------------------------------------------
  deploy:
    name: Build, Push & Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        # GHCR requires the image path to be all-lowercase; github.repository
        # keeps whatever case your repo name actually has.
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_LC }}:latest
            ghcr.io/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render watches your GitHub repo directly, but if you've turned that
      # off (or want deploys gated behind this pipeline instead), a Deploy
      # Hook does the same job with a single authenticated POST request.
      # Get the URL from: Render Dashboard -> your service -> Settings ->
      # Deploy Hook. Store it as a repo secret named RENDER_DEPLOY_HOOK.
      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
